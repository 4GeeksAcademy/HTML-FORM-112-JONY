<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/36b374186f.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="form-container mt-2 mb-2 ms-2 me-2">
        <div class="card">

            <!-- ENCABEZADO -->

            <div class="card-header bg-light">
                <h2>Payment form example</h2>
            </div>

            <!-- ALERTA -->
            <div class="row mt-3 ms-3 me-3">
                <div class="alert alert-danger" role="alert">
                    Some fields are missing
                </div>
            </div>
            <form novalidate>

                <!-- FILA UNO -->

                <div class="row mb-3 ms-1 me-1">
                    <div class="col-md-5">
                        <label for="cc-name" class="form-label">Card #</label>
                        <input type="text" class="form-control" id="cc-name" required maxlength="16">
                    </div>
                    <div class="col-md-3">
                        <label for="cc-number" class="form-label">CVC #</label>
                        <input type="text" class="form-control" id="cc-number" required maxlength="4">
                    </div>
                    <div class="col-md-4">
                        <label for="basic-url" class="form-label">Amount</label>
                        <div class="input-group">
                            <span class="input-group-text" id="basic-addon3"><i
                                    class="fa-solid fa-dollar-sign"></i></span>
                            <input type="text" class="form-control" id="basic-url"
                                aria-describedby="basic-addon3 basic-addon4">
                        </div>
                    </div>
                </div>

                <!-- FILA DOS -->

                <div class="row mb-3 ms-1 me-1">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" required>
                    </div>
                </div>

                <!-- FILA TRES -->

                <div class="row mb-3 ms-1 me-1">
                    <div class="col-md-6">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" required>
                    </div>
                    <div class="col-md-3">
                        <label for="state" class="form-label">State</label>
                        <select class="form-select" id="state" required>
                            <option value="">Pick a state</option>
                            <option>Hola</option>
                            <option>Qué</option>
                            <option>Tal</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="postal" class="form-label">Postal Code</label>
                        <input type="text" class="form-control" id="postal" required>
                    </div>
                </div>

                <!-- FILA CUATRO -->

                <div class="row mb-3 ms-1 me-1">
                    <div class="col-6">
                        <label for="message" class="form-label">We accept</label>
                        <br>
                        <div class="form-check form-check-inline bg-secondary">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1"
                                value="option1">
                            <label class="form-check-label" for="inlineRadio1">
                                <i class=" fa-brands fa-cc-mastercard" style="color: #ffffff"></i></label>
                        </div>
                        <div class="form-check form-check-inline bg-secondary">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2"
                                value="option2">
                            <label class="form-check-label" for="inlineRadio2"><i class="fa-brands fa-cc-visa"
                                    style="color: #ffffff"></i></label>
                        </div>
                        <div class="form-check form-check-inline bg-secondary">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3"
                                value="option3">
                            <label class="form-check-label" for="inlineRadio3"><i class="fa-solid fa-credit-card"
                                    style="color: #ffffff"></i></label>
                        </div>
                        <div class="form-check form-check-inline bg-secondary">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3"
                                value="option4">
                            <label class="form-check-label" for="inlineRadio3"><i class="fa-brands fa-cc-paypal"
                                    style="color: #ffffff;"></i></label>
                        </div>
                    </div>

                    <div class="col-6">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="3"></textarea>
                        <small class="text-muted">Add any notes here.</small>
                    </div>
                </div>
        </div>

        <!-- BOTONES -->
        <div class="class row mt-2 mb-2 me-2 bg-light">
            <div class="card-footer text-body-secondary">
                <div class="d-grid gap-2 d-md-flex justify-content-md-end bg-light">
                    <button type="button" class="btn btn-secondary">Cancel</button>
                    <button type="button" class="btn btn-primary">Send</button>
                </div>
            </div>
        </div>
    </div>
    </form>
    </div>
</body>

</html>
